name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing version rather than stopping at the first.
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Enable the npm cache only when a lockfile exists. Setting
          # `cache: npm` unconditionally fails the job outright in a repository
          # without one, which would contradict the fallback in the next step.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      # npm ci requires a lockfile. Fall back so the workflow also works before
      # the lockfile is committed.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — falling back to npm install. Commit the lockfile for reproducible builds."
            npm install
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  # Encore's own parser is the real build gate: it is what catches an invalid
  # service topology, a bad database declaration, or a malformed migration.
  # It runs once rather than per Node version, because its result cannot differ
  # between them.
  encore-build:
    name: Encore build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install the Encore CLI
        run: |
          curl -fsSL https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      # --skip-config: the point here is that the application compiles and its
      # service topology resolves, not that it is ready to self-host. Without
      # the flag the build demands an infra configuration file naming a
      # database host, which CI has no reason to provide.
      - name: Build
        run: encore build docker merchant-outreach-agent:ci --skip-config

  # The dashboard is a separate npm project with its own lockfile, because it is
  # deployed separately. The root tsconfig excludes it and the root ESLint
  # config ignores it, so nothing above would catch a break in it.
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      # typecheck && lint && build. The build is the step that matters: it is
      # what prerenders all forty drafts, and a fixture that violates the
      # contract throws while it does.
      - name: Verify
        run: npm run verify

  # WS6: the eval suite. A separate job because it is a separate language and a
  # separate claim — `npm run verify` says the pipeline compiles and its unit
  # tests pass; this says the gates still catch what they are supposed to catch
  # and no metric has regressed past its tolerance.
  #
  # It never calls a model. `test_gates.py` and `test_grounding.py` run on
  # fixtures by construction, and `test_triage.py` and `judge.py` run in
  # `fixture` mode, replaying recorded responses. The live run is a separate,
  # manually triggered workflow with a cost cap: evals-live.yml.
  evals:
    name: Evals (WS6)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The suite measures the real gates by running them, so it needs Node and
      # the repository's dependencies — not a Python re-implementation that
      # would drift from the thing it is supposed to be measuring.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: evals/uv.lock

      # --frozen: the lockfile is committed, and an eval run that quietly
      # resolved a different pytest is a run whose result is not reproducible.
      - name: Install Python dependencies
        working-directory: evals
        run: uv sync --frozen

      - name: Run the eval suite
        working-directory: evals
        run: uv run pytest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # gitleaks scans commits, not just the working tree. Without the full
          # history it sees only the latest commit and misses a key that was
          # committed earlier and deleted later — which is still in the history,
          # and still compromised.
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose
          # --redact keeps the matched secret out of this public build log.
          # Without it, a failing scan prints the very thing it just found.
